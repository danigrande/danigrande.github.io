<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Snake</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0f;
            font-family: 'Orbitron', monospace;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                repeating-linear-gradient(
                    0deg,
                    rgba(0, 255, 255, 0.03) 0px,
                    rgba(0, 255, 255, 0.03) 1px,
                    transparent 1px,
                    transparent 2px
                );
            pointer-events: none;
            z-index: 1;
        }

        .game-wrapper {
            position: relative;
            z-index: 2;
        }

        .game-container {
            text-align: center;
            position: relative;
            padding: 20px;
            background: rgba(10, 10, 20, 0.8);
            border: 2px solid #00ffff;
            box-shadow: 
                0 0 20px rgba(0, 255, 255, 0.3),
                inset 0 0 20px rgba(0, 255, 255, 0.1);
            clip-path: polygon(
                0 10px, 10px 0,
                calc(100% - 10px) 0, 100% 10px,
                100% calc(100% - 10px), calc(100% - 10px) 100%,
                10px 100%, 0 calc(100% - 10px)
            );
        }

        .title {
            font-size: 36px;
            font-weight: 900;
            color: #00ffff;
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-bottom: 15px;
            text-shadow: 
                0 0 10px #00ffff,
                0 0 20px #00ffff,
                0 0 40px #00ffff;
            animation: flicker 3s infinite;
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            92% { opacity: 1; }
            93% { opacity: 0.8; }
            94% { opacity: 1; }
            96% { opacity: 0.9; }
            97% { opacity: 1; }
        }

        .score-panel {
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            margin-bottom: 15px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
        }

        .score, .high-score {
            font-size: 18px;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
        }

        .score span, .high-score span {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }

        canvas {
            display: block;
            border: 2px solid #ff00ff;
            background: #0a0a15;
            box-shadow: 
                0 0 15px rgba(255, 0, 255, 0.4),
                inset 0 0 30px rgba(255, 0, 255, 0.1);
        }

        .status-message {
            margin-top: 15px;
            padding: 15px;
            font-size: 16px;
            color: #ff0040;
            text-shadow: 0 0 10px #ff0040;
            text-transform: uppercase;
            letter-spacing: 3px;
            min-height: 50px;
        }

        .status-message.game-over {
            animation: pulse-red 0.5s ease-in-out infinite;
        }

        @keyframes pulse-red {
            0%, 100% { text-shadow: 0 0 10px #ff0040; }
            50% { text-shadow: 0 0 20px #ff0040, 0 0 30px #ff0040; }
        }

        .status-message.ready {
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .control-key {
            display: inline-block;
            padding: 8px 15px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff;
            color: #00ffff;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.2);
        }

        .glitch {
            position: relative;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .glitch::before {
            animation: glitch-1 2s infinite linear alternate-reverse;
            color: #ff00ff;
            z-index: -1;
        }

        .glitch::after {
            animation: glitch-2 2s infinite linear alternate-reverse;
            color: #00ffff;
            z-index: -2;
        }

        @keyframes glitch-1 {
            0%, 100% { clip-path: inset(0 0 95% 0); transform: translate(-2px, 0); }
            20% { clip-path: inset(30% 0 40% 0); transform: translate(2px, 0); }
            40% { clip-path: inset(60% 0 10% 0); transform: translate(-1px, 0); }
            60% { clip-path: inset(10% 0 70% 0); transform: translate(1px, 0); }
            80% { clip-path: inset(80% 0 5% 0); transform: translate(-2px, 0); }
        }

        @keyframes glitch-2 {
            0%, 100% { clip-path: inset(95% 0 0 0); transform: translate(2px, 0); }
            20% { clip-path: inset(40% 0 30% 0); transform: translate(-2px, 0); }
            40% { clip-path: inset(10% 0 60% 0); transform: translate(1px, 0); }
            60% { clip-path: inset(70% 0 10% 0); transform: translate(-1px, 0); }
            80% { clip-path: inset(5% 0 80% 0); transform: translate(2px, 0); }
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #00ffff;
            box-shadow: 0 0 10px #00ffff;
            animation: float linear infinite;
        }

        @keyframes float {
            from { transform: translateY(100vh) translateX(0); }
            to { transform: translateY(-10px) translateX(100px); }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="game-wrapper">
        <div class="game-container">
            <h1 class="title glitch" data-text="CYBER SNAKE">CYBER SNAKE</h1>
            
            <div class="score-panel">
                <div class="score">SCORE: <span id="score">0</span></div>
                <div class="high-score">HIGH: <span id="highScore">0</span></div>
            </div>
            
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <div class="status-message ready" id="status">Press any arrow key to start</div>
            
            <div class="controls">
                <span class="control-key">↑ W</span>
                <span class="control-key">↓ S</span>
                <span class="control-key">← A</span>
                <span class="control-key">→ D</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const statusElement = document.getElementById('status');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('cyberSnakeHighScore') || 0;
        let gameOver = false;
        let gameStarted = false;
        let particles = [];

        highScoreElement.textContent = highScore;

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = Math.random() * 4 + 2;
                this.speedX = (Math.random() - 0.5) * 8;
                this.speedY = (Math.random() - 0.5) * 8;
                this.life = 1;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life -= 0.02;
                this.size *= 0.98;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push(new Particle(
                    x * gridSize + gridSize / 2,
                    y * gridSize + gridSize / 2,
                    color
                ));
            }
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.05)';
            ctx.lineWidth = 0.5;
            
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
        }

        function drawSnake() {
            snake.forEach((segment, index) => {
                const hue = (index * 10 + Date.now() / 20) % 360;
                const color = index === 0 ? '#00ffff' : `hsl(${hue}, 100%, 50%)`;
                
                ctx.fillStyle = color;
                ctx.shadowColor = color;
                ctx.shadowBlur = index === 0 ? 20 : 10;
                
                ctx.fillRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2
                );

                if (index === 0) {
                    ctx.fillStyle = '#0a0a15';
                    ctx.shadowBlur = 0;
                    
                    const eyeSize = 4;
                    const eyeOffset = 5;
                    
                    if (dx === 1) {
                        ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 5, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + 12, segment.y * gridSize + 11, eyeSize, eyeSize);
                    } else if (dx === -1) {
                        ctx.fillRect(segment.x * gridSize + 4, segment.y * gridSize + 5, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + 4, segment.y * gridSize + 11, eyeSize, eyeSize);
                    } else if (dy === -1) {
                        ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 4, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + 11, segment.y * gridSize + 4, eyeSize, eyeSize);
                    } else {
                        ctx.fillRect(segment.x * gridSize + 5, segment.y * gridSize + 12, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * gridSize + 11, segment.y * gridSize + 12, eyeSize, eyeSize);
                    }
                }
            });
        }

        function drawFood() {
            const pulse = Math.sin(Date.now() / 200) * 0.3 + 0.7;
            const color = `rgba(255, 0, 255, ${pulse})`;
            
            ctx.fillStyle = '#ff00ff';
            ctx.shadowColor = '#ff00ff';
            ctx.shadowBlur = 20 * pulse;
            
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();

            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                3,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }

        function drawParticles() {
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
        }

        function moveSnake() {
            if (dx === 0 && dy === 0) return;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (!checkFoodCollision()) {
                snake.pop();
            }
        }

        function checkCollision() {
            const head = snake[0];

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return true;
            }

            for (let i = 1; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    return true;
                }
            }

            return false;
        }

        function checkFoodCollision() {
            return snake[0].x === food.x && snake[0].y === food.y;
        }

        function placeFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);

            for (let segment of snake) {
                if (segment.x === food.x && segment.y === food.y) {
                    placeFood();
                    return;
                }
            }
        }

        function drawGame() {
            ctx.fillStyle = '#0a0a15';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawGrid();
            drawParticles();

            if (gameStarted && !gameOver) {
                moveSnake();
                
                if (checkCollision()) {
                    gameOver = true;
                    createExplosion(snake[0].x, snake[0].y, '#ff0040');
                    statusElement.textContent = 'SYSTEM FAILURE - Press SPACE to reboot';
                    statusElement.className = 'status-message game-over';
                    
                    if (score > highScore) {
                        highScore = score;
                        highScoreElement.textContent = highScore;
                        localStorage.setItem('cyberSnakeHighScore', highScore);
                    }
                    return;
                }
                
                if (checkFoodCollision()) {
                    score++;
                    scoreElement.textContent = score;
                    createExplosion(food.x, food.y, '#00ff00');
                    placeFood();
                }
            }

            drawFood();
            drawSnake();
        }

        document.addEventListener('keydown', (e) => {
            if (gameOver && e.code === 'Space') {
                resetGame();
                return;
            }

            if (!gameStarted && ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'w', 'a', 's', 'd', 'W', 'A', 'S', 'D'].includes(e.key)) {
                gameStarted = true;
                statusElement.textContent = '';
                statusElement.className = 'status-message';
            }

            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (dy !== 1) { dx = 0; dy = -1; }
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (dy !== -1) { dx = 0; dy = 1; }
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (dx !== 1) { dx = -1; dy = 0; }
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (dx !== -1) { dx = 1; dy = 0; }
                    break;
            }
        });

        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            food = { x: 15, y: 15 };
            dx = 0;
            dy = 0;
            score = 0;
            gameOver = false;
            gameStarted = false;
            particles = [];
            scoreElement.textContent = score;
            statusElement.textContent = 'Press any arrow key to start';
            statusElement.className = 'status-message ready';
        }

        function createBackgroundParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 10 + 5) + 's';
                particle.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(particle);
            }
        }

        createBackgroundParticles();
        setInterval(drawGame, 100);
    </script>
</body>
</html>
